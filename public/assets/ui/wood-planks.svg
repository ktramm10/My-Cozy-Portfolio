<!-- 32x32 art-pixel tile of four staggered wooden planks. Tiles seamlessly; shown at 2x via CSS. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <rect width="32" height="32" fill="#9a6236"/>

    <!-- Plank 1 -->
    <rect x="0" y="0" width="32" height="1" fill="#b57843"/>
    <rect x="0" y="6" width="32" height="1" fill="#7a4a29"/>
    <rect x="0" y="7" width="32" height="1" fill="#4a2c1a"/>
    <rect x="3" y="2" width="5" height="1" fill="#7a4a29"/>
    <rect x="10" y="4" width="4" height="1" fill="#7a4a29"/>
    <rect x="25" y="4" width="4" height="1" fill="#7a4a29"/>
    <rect x="20" y="0" width="1" height="7" fill="#4a2c1a"/>
    <rect x="21" y="0" width="1" height="6" fill="#b57843"/>
    <rect x="18" y="3" width="1" height="1" fill="#4a2c1a"/>
    <rect x="23" y="3" width="1" height="1" fill="#4a2c1a"/>

    <!-- Plank 2 -->
    <rect x="0" y="8" width="32" height="1" fill="#b57843"/>
    <rect x="0" y="14" width="32" height="1" fill="#7a4a29"/>
    <rect x="0" y="15" width="32" height="1" fill="#4a2c1a"/>
    <rect x="14" y="10" width="6" height="1" fill="#7a4a29"/>
    <rect x="24" y="12" width="4" height="1" fill="#7a4a29"/>
    <rect x="11" y="13" width="3" height="1" fill="#7a4a29"/>
    <rect x="6" y="8" width="1" height="7" fill="#4a2c1a"/>
    <rect x="7" y="8" width="1" height="6" fill="#b57843"/>
    <rect x="4" y="11" width="1" height="1" fill="#4a2c1a"/>
    <rect x="9" y="11" width="1" height="1" fill="#4a2c1a"/>

    <!-- Plank 3 -->
    <rect x="0" y="16" width="32" height="1" fill="#b57843"/>
    <rect x="0" y="22" width="32" height="1" fill="#7a4a29"/>
    <rect x="0" y="23" width="32" height="1" fill="#4a2c1a"/>
    <rect x="2" y="18" width="4" height="1" fill="#7a4a29"/>
    <rect x="11" y="20" width="6" height="1" fill="#7a4a29"/>
    <rect x="19" y="18" width="3" height="1" fill="#7a4a29"/>
    <rect x="26" y="16" width="1" height="7" fill="#4a2c1a"/>
    <rect x="27" y="16" width="1" height="6" fill="#b57843"/>
    <rect x="24" y="19" width="1" height="1" fill="#4a2c1a"/>
    <rect x="29" y="19" width="1" height="1" fill="#4a2c1a"/>

    <!-- Plank 4 -->
    <rect x="0" y="24" width="32" height="1" fill="#b57843"/>
    <rect x="0" y="30" width="32" height="1" fill="#7a4a29"/>
    <rect x="0" y="31" width="32" height="1" fill="#4a2c1a"/>
    <rect x="17" y="26" width="5" height="1" fill="#7a4a29"/>
    <rect x="3" y="28" width="5" height="1" fill="#7a4a29"/>
    <rect x="25" y="28" width="4" height="1" fill="#7a4a29"/>
    <rect x="12" y="24" width="1" height="7" fill="#4a2c1a"/>
